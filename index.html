<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Maker</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#FF85BB" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Invoice" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy:  { DEFAULT:'#021A54', light:'#0d2d7a', muted:'#354a7a', soft:'#e8ecf5' },
            pink:  { DEFAULT:'#FF85BB', light:'#FFCEE3', pale:'#fff0f7', dark:'#e0609a' },
            smoke: { DEFAULT:'#F5F5F5', dark:'#e8e8e8' },
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap');

    * { font-family: 'DM Sans', sans-serif; }
    .serif { font-family: 'DM Serif Display', serif; }

    body { background: linear-gradient(135deg, #FFCEE3 0%, #F5F5F5 50%, #e8ecf5 100%); }

    .glass {
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    /* Floating labels */
    .fl { position: relative; }
    .fl input, .fl textarea { padding-top: 1.2rem; padding-bottom: 0.3rem; }
    .fl label {
      position: absolute; top: 50%; left: 0.75rem;
      transform: translateY(-50%); font-size: 0.78rem;
      color: #9ca3af; pointer-events: none; transition: all .18s ease;
      display: flex; align-items: center; gap: 4px;
    }
    .fl textarea ~ label { top: 0.95rem; transform: none; }
    .fl input:focus ~ label, .fl input:not(:placeholder-shown) ~ label,
    .fl textarea:focus ~ label, .fl textarea:not(:placeholder-shown) ~ label {
      top: 0.3rem; transform: none; font-size: 0.6rem; color: #FF85BB;
    }
    .fl label i { font-size: 0.9rem; line-height: 1; }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

    .inp {
      background: rgba(255,255,255,0.7);
      border: 1.5px solid #FFCEE3;
      border-radius: 0.75rem;
      color: #021A54;
      transition: all .18s;
    }
    .inp:focus { outline: none; border-color: #FF85BB; box-shadow: 0 0 0 3px rgba(255,133,187,0.15); }

    .inp-navy {
      background: rgba(255,255,255,0.7);
      border: 1.5px solid #d0d8ef;
      border-radius: 0.75rem;
      color: #021A54;
      transition: all .18s;
    }
    .inp-navy:focus { outline: none; border-color: #021A54; box-shadow: 0 0 0 3px rgba(2,26,84,0.1); }

    /* Section label pill */
    .sec-label {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 3px 10px; border-radius: 99px; margin-bottom: 10px;
    }
    .sec-label i { font-size: 0.85rem; }

    .row-enter { animation: fi .22s ease; }
    @keyframes fi { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:none; } }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #FFCEE3; border-radius: 99px; }

    /* icon inside input prefix */
    .icon-prefix { position:relative; }
    .icon-prefix i { position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:1rem; pointer-events:none; }
    .icon-prefix input { padding-left: 2rem !important; }

    /* ══════════════════════════════
       PRINT
    ══════════════════════════════ */
    @media print {
      @page { size: A4 portrait; margin: 8mm 10mm; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

      body { background: white !important; }
      .no-print { display: none !important; }
      .fixed    { display: none !important; }
      footer    { display: none !important; }

      #app {
        max-width: 100% !important; padding: 0 !important;
        display: flex !important; flex-direction: column !important; gap: 5px !important;
      }
      .glass {
        background: white !important; backdrop-filter: none !important;
        box-shadow: none !important; border: 1.5px solid #FFCEE3 !important;
        border-radius: 8px !important; margin: 0 !important;
      }
      .sec-label { padding: 2px 7px !important; margin-bottom: 4px !important; font-size: 0.52rem !important; }

      #card-header { padding: 6px 10px !important; }
      #card-header .serif { font-size: 1.4rem !important; }
      #card-header .logo-box { width: 42px !important; height: 42px !important; }
      #card-header .fl input    { font-size: 0.7rem !important; padding-top: 0.75rem !important; padding-bottom: 0.1rem !important; }
      #card-header .fl textarea { font-size: 0.68rem !important; padding-top: 0.75rem !important; padding-bottom: 0.1rem !important; line-height: 1.2 !important; }
      #card-header .fl label    { font-size: 0.5rem !important; }
      #card-header .space-y-1\.5 > * + * { margin-top: 2px !important; }

      #card-billto { padding: 5px 10px !important; }
      #card-billto .fl input  { font-size: 0.7rem !important; padding-top: 0.75rem !important; padding-bottom: 0.1rem !important; }
      #card-billto .fl label  { font-size: 0.5rem !important; }
      #card-billto .gap-2 { gap: 3px !important; }

      #card-items { padding: 8px 12px !important; }
      #card-items .col-header { font-size: 0.62rem !important; }
      #item-rows > div { padding: 4px 6px !important; border-radius: 6px !important; gap: 4px !important; }
      #item-rows input  { font-size: 0.78rem !important; padding: 3px 6px !important; }
      #item-rows .row-total { font-size: 0.8rem !important; }
      #card-items .totals-block span, #card-items .totals-block div { font-size: 0.72rem !important; }
      #card-items .grand-label { font-size: 0.88rem !important; }
      #card-items .grand-value { font-size: 1.05rem !important; }
      #card-items .my-3 { margin-top: 4px !important; margin-bottom: 4px !important; }
      #card-items .space-y-1\.5 > * + * { margin-top: 3px !important; }

      #bottom-row { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 5px !important; }
      #bottom-row .glass    { padding: 6px 8px !important; }
      #bottom-row textarea  { font-size: 0.68rem !important; line-height: 1.3 !important; }
      #bottom-row .fl input { font-size: 0.68rem !important; padding-top: 0.75rem !important; padding-bottom: 0.1rem !important; }
      #bottom-row .fl label { font-size: 0.5rem !important; }
      #bottom-row .space-y-1\.5 > * + * { margin-top: 2px !important; }

      #card-status { padding: 4px 10px !important; }
      #card-status .status-btn { padding: 1px 8px !important; font-size: 0.58rem !important; }
    }
  </style>
</head>

<body class="min-h-screen p-4 sm:p-6">

  <!-- bg blobs -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-32 -left-24 w-96 h-96 rounded-full opacity-40 blur-3xl" style="background:#FFCEE3"></div>
    <div class="absolute top-1/3 -right-20 w-80 h-80 rounded-full opacity-20 blur-3xl" style="background:#FF85BB"></div>
    <div class="absolute bottom-0 left-1/3 w-72 h-72 rounded-full opacity-15 blur-3xl" style="background:#021A54"></div>
  </div>

  <div id="app" class="max-w-2xl mx-auto space-y-3">

    <!-- ─── HEADER ─── -->
    <div id="card-header" class="glass rounded-3xl p-5" style="box-shadow:0 4px 24px rgba(255,133,187,0.15)">
      <div class="flex flex-col sm:flex-row sm:items-start gap-3">

        <!-- Logo upload -->
        <div class="flex-shrink-0">
          <label for="logo-upload" class="cursor-pointer group block">
            <div id="logo-placeholder"
                 class="logo-box w-16 h-16 rounded-2xl border-2 border-dashed flex flex-col items-center justify-center transition group-hover:opacity-75"
                 style="background:linear-gradient(135deg,#FFCEE3,#F5F5F5); border-color:#FF85BB; color:#FF85BB">
              <i class="ph ph-image-square" style="font-size:1.6rem"></i>
              <span class="text-xs font-medium mt-0.5">Logo</span>
            </div>
            <img id="logo-preview" src="" alt="logo" class="logo-box hidden w-16 h-16 rounded-2xl object-contain border shadow-sm" style="border-color:#FFCEE3" />
          </label>
          <input id="logo-upload" type="file" accept="image/*" class="hidden" onchange="previewLogo(this)" />
        </div>

        <!-- Business info -->
        <div class="flex-1 space-y-1.5">
          <div class="fl">
            <input id="biz-name" type="text" placeholder=" " class="inp w-full px-3 font-semibold text-sm" />
            <label><i class="ph ph-storefront"></i> Business Name</label>
          </div>
          <div class="fl">
            <textarea id="biz-address" rows="2" placeholder=" " class="inp w-full px-3 pt-5 pb-1 text-xs resize-none leading-snug"></textarea>
            <label><i class="ph ph-map-pin"></i> Address · Email · Phone</label>
          </div>
        </div>

        <!-- Invoice badge -->
        <div class="sm:text-right space-y-1.5 flex-shrink-0">
          <div class="flex sm:justify-end items-center gap-2">
            <i class="ph ph-receipt text-2xl" style="color:#FF85BB"></i>
            <div class="serif text-3xl leading-none" style="color:#021A54">Invoice</div>
          </div>
          <div class="flex sm:justify-end">
            <span id="status-badge"
                  class="inline-flex items-center gap-1 px-3 py-0.5 rounded-full text-xs font-semibold text-white"
                  style="background:#FF85BB">
              <i class="ph ph-clock-countdown"></i> Unpaid
            </span>
          </div>
          <div class="fl">
            <input id="inv-num" type="text" placeholder=" " value="#001" class="inp-navy w-32 text-right px-3 text-xs" />
            <label class="right-3 left-auto"><i class="ph ph-hash"></i> Invoice #</label>
          </div>
          <div class="fl">
            <input id="inv-date" type="date" class="inp-navy w-32 text-right px-3 text-xs" />
            <label class="right-3 left-auto"><i class="ph ph-calendar-blank"></i> Date</label>
          </div>
          <div class="fl">
            <input id="inv-due" type="date" class="inp-navy w-32 text-right px-3 text-xs" />
            <label class="right-3 left-auto"><i class="ph ph-calendar-check"></i> Due Date</label>
          </div>
        </div>
      </div>
    </div>

    <!-- ─── BILL TO ─── -->
    <div id="card-billto" class="glass rounded-3xl p-4" style="box-shadow:0 4px 20px rgba(2,26,84,0.07)">
      <div class="sec-label" style="background:#e8ecf5; color:#021A54">
        <i class="ph ph-user-circle"></i> Bill To
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
        <div class="fl">
          <input id="client-name" type="text" placeholder=" " class="inp-navy w-full px-3 font-medium text-sm" />
          <label><i class="ph ph-user"></i> Client Name</label>
        </div>
        <div class="fl">
          <input id="client-email" type="email" placeholder=" " class="inp-navy w-full px-3 text-xs" />
          <label><i class="ph ph-envelope"></i> Email Address</label>
        </div>
        <div class="fl">
          <input id="client-address" type="text" placeholder=" " class="inp-navy w-full px-3 text-xs" />
          <label><i class="ph ph-map-pin-area"></i> Address · City</label>
        </div>
      </div>
    </div>

    <!-- ─── ITEMS ─── -->
    <div id="card-items" class="glass rounded-3xl p-5" style="box-shadow:0 4px 24px rgba(255,133,187,0.12)">
      <div class="sec-label" style="background:#fff0f7; color:#FF85BB">
        <i class="ph ph-list-checks"></i> Items
      </div>

      <!-- Column headers -->
      <div class="hidden sm:grid grid-cols-12 gap-2 mb-2 px-2">
        <div class="col-header col-span-5 text-xs font-semibold uppercase tracking-wider flex items-center gap-1" style="color:#021A54; opacity:.45">
          <i class="ph ph-tag"></i> Description
        </div>
        <div class="col-header col-span-2 text-xs font-semibold uppercase tracking-wider text-center" style="color:#021A54; opacity:.45">Qty</div>
        <div class="col-header col-span-2 text-xs font-semibold uppercase tracking-wider text-right" style="color:#021A54; opacity:.45">Unit Price</div>
        <div class="col-header col-span-2 text-xs font-semibold uppercase tracking-wider text-right flex items-center justify-end gap-1" style="color:#021A54; opacity:.45">
          <i class="ph ph-coins"></i> Total
        </div>
        <div class="col-span-1"></div>
      </div>

      <div id="item-rows" class="space-y-2"></div>

      <!-- Add item -->
      <button onclick="addRow()"
              class="no-print mt-3 flex items-center gap-1.5 text-sm font-medium transition group"
              style="color:#FF85BB">
        <span class="w-7 h-7 rounded-full flex items-center justify-center transition group-hover:scale-110"
              style="background:#FFCEE3">
          <i class="ph ph-plus-circle" style="font-size:1.1rem"></i>
        </span>
        Add Item
      </button>

      <!-- Divider -->
      <div class="my-3 border-t border-dashed" style="border-color:#FFCEE3"></div>

      <!-- Totals -->
      <div class="totals-block max-w-xs ml-auto space-y-1.5">
        <div class="flex justify-between text-sm items-center" style="color:#021A54; opacity:.7">
          <span class="flex items-center gap-1"><i class="ph ph-sigma text-base"></i> Subtotal</span>
          <span id="subtotal">0 MMK</span>
        </div>
        <div class="flex items-center justify-between text-sm" style="color:#021A54; opacity:.7">
          <div class="flex items-center gap-2">
            <span class="flex items-center gap-1"><i class="ph ph-percent text-base"></i> Tax</span>
            <input id="tax-rate" type="number" value="0" min="0" max="100" oninput="calcTotals()"
                   class="w-12 rounded-lg px-1.5 py-0.5 text-center text-xs focus:outline-none transition"
                   style="background:#F5F5F5; border:1.5px solid #FFCEE3" />
            <span class="text-xs opacity-60">%</span>
          </div>
          <span id="tax-amount">0 MMK</span>
        </div>
        <div class="flex items-center justify-between text-sm" style="color:#021A54; opacity:.7">
          <div class="flex items-center gap-2">
            <span class="flex items-center gap-1"><i class="ph ph-ticket text-base"></i> Discount</span>
            <input id="discount" type="number" value="0" min="0" oninput="calcTotals()"
                   class="w-20 rounded-lg px-1.5 py-0.5 text-center text-xs focus:outline-none transition"
                   style="background:#F5F5F5; border:1.5px solid #FFCEE3" />
            <span class="text-xs opacity-60">MMK</span>
          </div>
          <span id="discount-amount" style="color:#FF85BB">-0 MMK</span>
        </div>
        <div class="pt-2 border-t flex items-center justify-between" style="border-color:#FFCEE3">
          <span class="grand-label serif text-lg flex items-center gap-1.5" style="color:#021A54">
            <i class="ph ph-wallet text-xl" style="color:#FF85BB"></i> Grand Total
          </span>
          <span id="grand-total" class="grand-value serif text-2xl font-medium" style="color:#FF85BB">0 MMK</span>
        </div>
      </div>
    </div>

    <!-- ─── NOTES & PAYMENT ─── -->
    <div id="bottom-row" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div class="glass rounded-3xl p-4" style="box-shadow:0 4px 16px rgba(2,26,84,0.06)">
        <div class="sec-label" style="background:#faefd8; color:#b07a20">
          <i class="ph ph-note-pencil"></i> Notes
        </div>
        <textarea id="notes" rows="3" placeholder="Thank you for your business! 🌸"
                  class="w-full rounded-xl px-3 py-2 text-xs resize-none focus:outline-none transition leading-snug"
                  style="background:rgba(245,245,245,0.6); border:1.5px solid #FFCEE3; color:#021A54"></textarea>
      </div>
      <div class="glass rounded-3xl p-4" style="box-shadow:0 4px 16px rgba(2,26,84,0.06)">
        <div class="sec-label" style="background:#e8ecf5; color:#021A54">
          <i class="ph ph-bank"></i> Payment Details
        </div>
        <div class="space-y-1.5">
          <div class="fl">
            <input id="bank-name" type="text" placeholder=" " class="inp-navy w-full px-3 text-xs" />
            <label><i class="ph ph-buildings"></i> Bank Name</label>
          </div>
          <div class="fl">
            <input id="account-num" type="text" placeholder=" " class="inp-navy w-full px-3 text-xs" />
            <label><i class="ph ph-credit-card"></i> Account Number</label>
          </div>
          <div class="fl">
            <input id="routing-num" type="text" placeholder=" " class="inp-navy w-full px-3 text-xs" />
            <label><i class="ph ph-arrows-left-right"></i> Routing / SWIFT</label>
          </div>
        </div>
      </div>
    </div>

    <!-- ─── STATUS + ACTIONS ─── -->
    <div id="card-status" class="glass rounded-3xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3"
         style="box-shadow:0 4px 20px rgba(255,133,187,0.12)">
      <div class="flex items-center gap-2">
        <span class="text-xs font-semibold uppercase tracking-widest flex items-center gap-1" style="color:#021A54; opacity:.45">
          <i class="ph ph-flag"></i> Status
        </span>
        <div class="flex gap-1.5">
          <button onclick="setStatus('unpaid')"  id="status-unpaid"  class="status-btn px-3 py-1 rounded-full text-xs font-semibold border transition flex items-center gap-1">
            <i class="ph ph-clock-countdown"></i> Unpaid
          </button>
          <button onclick="setStatus('paid')"    id="status-paid"    class="status-btn px-3 py-1 rounded-full text-xs font-semibold border transition flex items-center gap-1">
            <i class="ph ph-check-circle"></i> Paid
          </button>
          <button onclick="setStatus('overdue')" id="status-overdue" class="status-btn px-3 py-1 rounded-full text-xs font-semibold border transition flex items-center gap-1">
            <i class="ph ph-warning-circle"></i> Overdue
          </button>
        </div>
      </div>
      <div class="no-print flex gap-2">
        <button onclick="clearAll()"
                class="px-3 py-1.5 rounded-2xl text-xs font-medium transition flex items-center gap-1.5"
                style="background:#F5F5F5; color:#021A54">
          <i class="ph ph-arrow-counter-clockwise"></i> Clear
        </button>
        <button onclick="window.print()"
                class="px-4 py-1.5 rounded-2xl text-white text-xs font-semibold transition flex items-center gap-1.5"
                style="background:linear-gradient(135deg,#FF85BB,#e0609a); box-shadow:0 4px 14px rgba(255,133,187,0.4)">
          <i class="ph ph-printer text-sm"></i> Print / PDF
        </button>
      </div>
    </div>

    <footer class="text-center text-xs pb-2 flex items-center justify-center gap-1" style="color:#FF85BB; opacity:.6">
      <i class="ph ph-heart-straight"></i> Made with love · Invoice Maker
    </footer>
  </div>

<script>
  /* Logo */
  function previewLogo(input) {
    if (!input.files?.[0]) return;
    const r = new FileReader();
    r.onload = e => {
      document.getElementById('logo-placeholder').classList.add('hidden');
      const p = document.getElementById('logo-preview');
      p.src = e.target.result;
      p.classList.remove('hidden');
    };
    r.readAsDataURL(input.files[0]);
  }

  /* Currency */
  const fmt   = n => Math.max(0, n).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + ' MMK';
  const parse = s => parseFloat(String(s).replace(/[, MMK]/g, '')) || 0;

  /* Rows */
  let rowCount = 0;
  function addRow(desc = '', qty = 1, price = 0) {
    rowCount++;
    const id = `row-${rowCount}`;
    const div = document.createElement('div');
    div.id = id;
    div.className = 'row-enter grid grid-cols-12 gap-2 items-center rounded-xl px-2 py-2';
    div.style.background = 'rgba(255,206,227,0.18)';
    div.innerHTML = `
      <div class="col-span-12 sm:hidden text-xs font-semibold uppercase tracking-wider px-1 flex items-center gap-1" style="color:#021A54; opacity:.5">
        <i class="ph ph-package"></i> Item ${rowCount}
      </div>

      <input type="text" placeholder="Item description…" value="${esc(desc)}"
             class="col-span-12 sm:col-span-5 rounded-lg px-3 py-2 text-sm focus:outline-none transition"
             style="background:white; border:1.5px solid #FFCEE3; color:#021A54"
             oninput="calcTotals()" />

      <div class="col-span-4 sm:col-span-2 flex flex-col items-center gap-0.5">
        <span class="sm:hidden text-xs flex items-center gap-0.5" style="color:#021A54; opacity:.5"><i class="ph ph-hash"></i>Qty</span>
        <input type="number" value="${qty}" min="0" id="${id}-qty"
               class="w-full rounded-lg px-2 py-2 text-sm text-center focus:outline-none transition"
               style="background:white; border:1.5px solid #FFCEE3; color:#021A54"
               oninput="calcRow('${id}'); calcTotals()" />
      </div>

      <div class="col-span-4 sm:col-span-2 flex flex-col items-center gap-0.5">
        <span class="sm:hidden text-xs flex items-center gap-0.5" style="color:#021A54; opacity:.5"><i class="ph ph-currency-circle-dollar"></i>Price</span>
        <input type="number" value="${price}" min="0" step="1" id="${id}-price"
               class="w-full rounded-lg px-2 py-2 text-sm text-right focus:outline-none transition"
               style="background:white; border:1.5px solid #FFCEE3; color:#021A54"
               oninput="calcRow('${id}'); calcTotals()" />
      </div>

      <div class="col-span-3 sm:col-span-2 flex flex-col items-center gap-0.5">
        <span class="sm:hidden text-xs flex items-center gap-0.5" style="color:#021A54; opacity:.5"><i class="ph ph-equals"></i>Total</span>
        <span id="${id}-total" class="row-total text-sm font-semibold text-right w-full pr-1" style="color:#FF85BB">0 MMK</span>
      </div>

      <button onclick="removeRow('${id}')"
              class="no-print col-span-1 flex items-center justify-center transition rounded-lg py-2 group"
              style="color:#FFCEE3">
        <i class="ph ph-x-circle text-lg group-hover:text-pink-DEFAULT transition" style="transition:color .15s"
           onmouseover="this.style.color='#FF85BB'" onmouseout="this.style.color='#FFCEE3'"></i>
      </button>
    `;
    document.getElementById('item-rows').appendChild(div);
    calcRow(id);
    calcTotals();
  }

  function esc(s) { return String(s).replace(/"/g, '&quot;'); }

  function removeRow(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.cssText += ';opacity:0;transform:translateY(-5px);transition:all .18s';
    setTimeout(() => { el.remove(); calcTotals(); }, 190);
  }

  function calcRow(id) {
    const qty   = parseFloat(document.getElementById(`${id}-qty`)?.value)   || 0;
    const price = parseFloat(document.getElementById(`${id}-price`)?.value) || 0;
    const el    = document.getElementById(`${id}-total`);
    if (el) el.textContent = fmt(qty * price);
  }

  function calcTotals() {
    let sub = 0;
    document.querySelectorAll('[id$="-total"]').forEach(el => { sub += parse(el.textContent); });
    const taxRate  = parseFloat(document.getElementById('tax-rate').value) || 0;
    const discount = parseFloat(document.getElementById('discount').value)  || 0;
    const tax   = sub * taxRate / 100;
    const grand = Math.max(0, sub + tax - discount);
    document.getElementById('subtotal').textContent        = fmt(sub);
    document.getElementById('tax-amount').textContent      = fmt(tax);
    document.getElementById('discount-amount').textContent = '-' + fmt(discount);
    document.getElementById('grand-total').textContent     = fmt(grand);
  }

  /* Status */
  const SS = {
    unpaid:  { style:`background:#fff0f7; color:#FF85BB; border-color:#FFCEE3`,  activeStyle:`background:#FF85BB; color:white; border-color:#FF85BB`,  icon:'ph-clock-countdown', label:'Unpaid',  badge:'#FF85BB' },
    paid:    { style:`background:#e8ecf5; color:#021A54; border-color:#d0d8ef`,  activeStyle:`background:#021A54; color:white; border-color:#021A54`,  icon:'ph-check-circle',    label:'Paid',    badge:'#021A54' },
    overdue: { style:`background:#fff0f7; color:#e0609a; border-color:#FFCEE3`,  activeStyle:`background:#e0609a; color:white; border-color:#e0609a`,  icon:'ph-warning-circle',  label:'Overdue', badge:'#e0609a' },
  };
  let cur = null;

  function setStatus(s) {
    if (cur === s) { resetStatus(); return; }
    resetStatus(); cur = s;
    const btn = document.getElementById(`status-${s}`);
    btn.setAttribute('style', SS[s].activeStyle);
    btn.className = 'status-btn px-3 py-1 rounded-full text-xs font-semibold border transition flex items-center gap-1';
    const badge = document.getElementById('status-badge');
    badge.style.background = SS[s].badge;
    badge.innerHTML = `<i class="ph ${SS[s].icon}"></i> ${SS[s].label}`;
  }

  function resetStatus() {
    Object.keys(SS).forEach(s => {
      const btn = document.getElementById(`status-${s}`);
      btn.setAttribute('style', SS[s].style);
      btn.className = 'status-btn px-3 py-1 rounded-full text-xs font-semibold border transition flex items-center gap-1';
    });
    document.getElementById('status-badge').style.background = '#FF85BB';
    document.getElementById('status-badge').innerHTML = '<i class="ph ph-clock-countdown"></i> Unpaid';
    cur = null;
  }

  /* Clear */
  function clearAll() {
    if (!confirm('Clear all invoice data?')) return;
    ['biz-name','biz-address','client-name','client-email','client-address','notes','bank-name','account-num','routing-num']
      .forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    document.getElementById('inv-num').value  = '#001';
    document.getElementById('tax-rate').value = '0';
    document.getElementById('discount').value = '0';
    document.getElementById('inv-date').value = '';
    document.getElementById('inv-due').value  = '';
    document.getElementById('item-rows').innerHTML = '';
    rowCount = 0;
    resetStatus();
    calcTotals();
    document.getElementById('logo-placeholder').classList.remove('hidden');
    const lp = document.getElementById('logo-preview');
    lp.classList.add('hidden'); lp.src = '';
    addRow('', 1, 0);
  }

  /* Init */
  (function () {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('inv-date').value = today;
    const due = new Date(); due.setDate(due.getDate() + 30);
    document.getElementById('inv-due').value = due.toISOString().split('T')[0];
    setStatus('unpaid');
    addRow('Design Services',   1, 1200000);
    addRow('Illustration Pack', 3,  150000);
    addRow('Revisions',         2,   75000);
  })();
</script>

<!-- ─── PWA: Install banner + Service Worker ─── -->

<!-- Install prompt banner (hidden until browser fires beforeinstallprompt) -->
<div id="pwa-banner"
     class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50 no-print"
     style="width: min(92vw, 440px)">
  <div class="glass rounded-3xl px-5 py-3 flex items-center gap-3"
       style="box-shadow:0 8px 32px rgba(255,133,187,0.25); border:1.5px solid #FFCEE3">
    <img src="icon.svg" class="w-10 h-10 rounded-xl flex-shrink-0" alt="icon" />
    <div class="flex-1 min-w-0">
      <p class="text-sm font-semibold" style="color:#021A54">Install Invoice Maker</p>
      <p class="text-xs" style="color:#021A54; opacity:.55">Add to home screen · works offline 🌸</p>
    </div>
    <div class="flex gap-2 flex-shrink-0">
      <button id="pwa-dismiss"
              class="px-3 py-1.5 rounded-2xl text-xs font-medium"
              style="background:#F5F5F5; color:#021A54">Later</button>
      <button id="pwa-install"
              class="px-3 py-1.5 rounded-2xl text-xs font-semibold text-white flex items-center gap-1"
              style="background:linear-gradient(135deg,#FF85BB,#e0609a); box-shadow:0 4px 12px rgba(255,133,187,0.35)">
        <i class="ph ph-download-simple"></i> Install
      </button>
    </div>
  </div>
</div>

<!-- Offline toast -->
<div id="offline-toast"
     class="hidden fixed top-5 left-1/2 -translate-x-1/2 z-50 no-print">
  <div class="flex items-center gap-2 px-4 py-2 rounded-full text-xs font-semibold text-white"
       style="background:#021A54; box-shadow:0 4px 16px rgba(2,26,84,0.3)">
    <i class="ph ph-wifi-slash"></i> You're offline — app still works!
  </div>
</div>

<!-- Online restored toast -->
<div id="online-toast"
     class="hidden fixed top-5 left-1/2 -translate-x-1/2 z-50 no-print">
  <div class="flex items-center gap-2 px-4 py-2 rounded-full text-xs font-semibold text-white"
       style="background:#10b98a; box-shadow:0 4px 16px rgba(16,185,138,0.3)">
    <i class="ph ph-wifi-high"></i> Back online!
  </div>
</div>

<script>
  /* ── Service Worker ── */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('[SW] Registered:', reg.scope))
        .catch(err => console.warn('[SW] Registration failed:', err));
    });
  }

  /* ── Install Prompt ── */
  let deferredPrompt = null;
  const banner   = document.getElementById('pwa-banner');
  const btnInst  = document.getElementById('pwa-install');
  const btnDism  = document.getElementById('pwa-dismiss');

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    // Show banner after 2 s so user settles in first
    setTimeout(() => banner.classList.remove('hidden'), 2000);
  });

  btnInst?.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    banner.classList.add('hidden');
    console.log('[PWA] Install outcome:', outcome);
  });

  btnDism?.addEventListener('click', () => banner.classList.add('hidden'));

  // Hide banner once installed
  window.addEventListener('appinstalled', () => {
    banner.classList.add('hidden');
    deferredPrompt = null;
    console.log('[PWA] Installed successfully!');
  });

  /* ── Offline / Online toasts ── */
  function showToast(id, duration = 3000) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), duration);
  }

  window.addEventListener('offline', () => showToast('offline-toast', 4000));
  window.addEventListener('online',  () => showToast('online-toast',  3000));
</script>
</body>
</html>
